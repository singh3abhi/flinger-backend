name: CI

on:
  pull_request:
    branches: [uat-release]
  push:
    branches: [uat-release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # Includes the OpenAPI contract check: fails if openapi/openapi.json is stale.
      - run: pnpm test:e2e
      - run: pnpm build

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_USER: flinger
          POSTGRES_PASSWORD: flinger
          POSTGRES_DB: flinger
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flinger -d flinger"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://flinger:flinger@localhost:5432/flinger
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to an empty database
        run: pnpm db:migrate
      - name: Applying again is a no-op
        run: pnpm db:migrate
      - name: Schema and migrations agree (no un-generated changes)
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "The schema changed but no migration was committed. Run 'pnpm db:generate' and commit drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

  docker:
    name: Docker image builds and boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: flinger-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and answers /health (dependencies not required for liveness)
        run: |
          docker run -d --name api -p 4000:4000 \
            -e APP_ENV=uat \
            -e DATABASE_URL=postgres://x:x@127.0.0.1:5432/x \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            flinger-backend:ci
          for i in $(seq 1 20); do curl -fsS localhost:4000/health && exit 0; sleep 1; done
          docker logs api
          exit 1

  contract:
    name: API contract has no breaking changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare openapi/openapi.json with the base branch
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git cat-file -e FETCH_HEAD:openapi/openapi.json 2>/dev/null; then
            git show FETCH_HEAD:openapi/openapi.json > /tmp/base.json
            cp openapi/openapi.json /tmp/head.json
            docker run --rm -v /tmp:/specs tufin/oasdiff breaking /specs/base.json /specs/head.json --fail-on ERR
          else
            echo "No spec on the base branch yet; nothing to compare."
          fi

  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
